<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista del Pastor - Manantial de Vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🕊️ Manantial de Vida (Pastor)</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="registro.html">Registro</a>
        <a class="nav-link" href="admin.html">Admin</a>
        <a class="nav-link active" href="pastor.html">Pastor</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="alert alert-info shadow-sm">
      <h5 class="fw-bold">💡 Resumen y Sugerencias del Día</h5>
      <p id="sugerenciaTiempo" class="mb-0">Calculando tiempos libres y visitas agendadas...</p>
    </div>

    <div class="row">
      <div class="col-md-7">
        <div class="card shadow p-3 mb-4 bg-white rounded">
          <h4 class="mb-3" style="color: var(--primary-navy);">📍 Visitas Programadas para Hoy (3 sugeridas)</h4>
          <ul class="list-group" id="listaVisitas">
            <!-- Cargado por JS -->
          </ul>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card shadow p-3 bg-white rounded">
          <h4 class="mb-3" style="color: var(--primary-navy);">📅 Agenda Extraoficial</h4>
          <ul class="list-group" id="agendaExtra">
            <li class="list-group-item">10:00 AM - Reunión de Pastores locales</li>
            <li class="list-group-item">05:00 PM - Consejo de Jóvenes</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    async function cargarPastor() {
      const { data, error } = await _supabase.from('registros_iglesia').select('*').limit(3);
      if(error) return;

      const lista = document.getElementById('listaVisitas');
      lista.innerHTML = '';
      data.forEach((reg, index) => {
        let horas = ['11:00 AM', '01:30 PM', '04:00 PM'];
        lista.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <h6 class="fw-bold mb-0">${reg.nombre_completo}</h6>
              <small class="text-muted">📍 ${reg.direccion}</small>
            </div>
            <span class="badge bg-primary rounded-pill">${horas[index] || '06:00 PM'}</span>
          </li>
        `;
      });

      document.getElementById('sugerenciaTiempo').innerText = 
        `Tiene 3 visitas asignadas en San Andrés Tuxtla. Se sugiere salir a las 10:30 AM para optimizar tiempos y mantener un bloque libre de 2 horas al mediodía para estudio y descanso.`;
    }

    cargarPastor();
  </script>
</body>
</html>
