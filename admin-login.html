<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - Manantial de Vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      background-color: #111827;
      border: 1px solid #374151;
      border-top: 5px solid #cbb281;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      padding: 30px;
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #4b5563;
      color: #ffffff;
      border-radius: 8px;
      padding: 12px;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #cbb281;
      color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(203, 178, 129, 0.25);
    }
    .btn-kraft {
      background-color: #cbb281;
      color: #080c14;
      font-weight: bold;
      border-radius: 8px;
      padding: 12px;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-kraft:hover {
      background-color: #b39762;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card card-login shadow-lg">
    <div class="text-center mb-4">
      <h3 class="fw-bold" style="color: #cbb281;">🔐 Panel Admin</h3>
      <p class="text-white-50 small">Iglesia Manantial de Vida</p>
    </div>

    <div id="alertaError" class="mb-3"></div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label text-white-50 small">Contraseña de Acceso</label>
        <input type="password" id="passwordAdmin" class="form-control" placeholder="Ingrese contraseña" required>
      </div>
      <button type="submit" class="btn btn-kraft w-100 shadow">Ingresar al Panel</button>
    </form>
    
    <div class="text-center mt-3">
      <a href="index.html" class="text-white-50 text-decoration-small small">← Volver al Inicio</a>
    </div>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", (e) => {
      e.preventDefault();
      const pass = document.getElementById("passwordAdmin").value;
      
      // Contraseña configurada
      if (pass === "manantial2026") {
        localStorage.setItem("adminLogueado", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("alertaError").innerHTML = `
          <div class="alert alert-danger py-2 small mb-0">Contraseña incorrecta.</div>
        `;
      }
    });
  </script>

</body>
</html>
