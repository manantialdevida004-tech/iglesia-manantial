<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Congregantes - Iglesia Manantial de Vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #080c14;
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }
    .navbar-custom {
      background-color: #0f172a !important;
      border-bottom: 2px solid #1e3a8a;
    }
    .fade-in-up {
      animation: fadeInUp 0.8s ease-in-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .carousel-custom img {
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
    }
    .card-registro {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-top: 5px solid #cbb281;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid #374151;
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      border-color: #cbb281;
      color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(203, 178, 129, 0.25);
    }
    .form-label {
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    .btn-kraft {
      background-color: #cbb281;
      color: #080c14;
      font-weight: bold;
      padding: 14px;
      border-radius: 10px;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-kraft:hover {
      background-color: #b39762;
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(203, 178, 129, 0.35);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
        <img src="logo.png" alt="Logo" width="40" height="40" class="rounded-circle me-2 border border-warning" onerror="this.src='https://via.placeholder.com/40?text=Logo'">
        <span style="color: #cbb281; font-size: 1.1rem;">Manantial de Vida</span>
      </a>
      <button class="navbar-toggler border-0 text-warning" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <div class="navbar-nav gap-2 mt-2 mt-lg-0">
          <a class="btn btn-outline-light btn-sm px-3" href="index.html">Inicio</a>
          <a class="btn btn-outline-warning btn-sm px-3 active" href="registro.html">Registro</a>
          <a class="btn btn-outline-light btn-sm px-3" href="admin.html">Admin</a>
          <a class="btn btn-outline-light btn-sm px-3" href="pastor.html">Pastor</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5 fade-in-up">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <div class="card card-registro p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #cbb281;">Registro de Congregantes</h2>
            <p class="text-white-50 small">Iglesia Cristiana Manantial de Vida - San Andrés Tuxtla, Ver.</p>
          </div>

          <div id="mensajeAlerta" class="mb-3"></div>

          <form id="formRegistro">
            <div class="mb-3">
              <label class="form-label">📌 Sección de Pertenencia</label>
              <select class="form-select" id="seccion" required>
                <option value="Congregantes / Adultos">Congregantes / Adultos</option>
                <option value="Jóvenes">Jóvenes</option>
                <option value="Niños">Niños</option>
                <option value="adolescente">Adolescentes</option>
                <option value="Visita">Visita</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">👤 Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" placeholder="Nombre(s) y Apellidos" required>
            </div>

            <div class="row mb-3">
              <div class="col-md-6 mb-3 mb-md-0">
                <label class="form-label">🎂 Edad</label>
                <input type="number" class="form-control" id="edad" placeholder="Ej. 15" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">🕊️ ¿Es Creyente / Bautizado?</label>
                <select class="form-select" id="bautizado">
                  <option value="Sí">Sí</option>
                  <option value="No">No</option>
                  <option value="En proceso">En proceso</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">📍 Dirección (Calle, Número, Colonia)</label>
              <input type="text" class="form-control" id="direccion" placeholder="Ej. C. Octavio Pérez González" required>
            </div>

            <div class="row mb-3">
              <div class="col-md-6 mb-3 mb-md-0">
                <label class="form-label">📞 Teléfono / WhatsApp</label>
                <input type="tel" class="form-control" id="telefono" placeholder="294 123 4567" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">📅 Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fecha_nacimiento" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Fotografía Personal (URL o Enlace)</label>
              <input type="text" class="form-control" id="foto" placeholder="https://ejemplo.com/foto.jpg">
            </div>

            <button type="submit" id="btnGuardar" class="btn btn-kraft w-100 shadow">💾 Registrar Información</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-white-50 border-top border-secondary small mt-5" style="background-color: #04060a;">
    <p class="mb-0">Iglesia Cristiana Manantial de Vida • San Andrés Tuxtla, Veracruz 🕊️</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
