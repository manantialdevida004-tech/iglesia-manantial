<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Manantial de Vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🕊️ Manantial de Vida</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link active" href="registro.html">Registro</a>
        <a class="nav-link" href="admin.html">Admin</a>
        <a class="nav-link" href="pastor.html">Pastor</a>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 600px;">
    <div class="card shadow p-4 rounded card-custom">
      <h2 class="text-center fw-bold mb-4" style="color: var(--primary-navy);">📝 Formulario de Registro</h2>
      
      <form id="formRegistro">
        <div class="mb-3">
          <label class="form-label fw-bold">Sección</label>
          <select class="form-select" id="seccion" required>
            <option value="congregante">Congregante</option>
            <option value="adolescente">Adolescente</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Nombre Completo</label>
          <input type="text" class="form-control" id="nombre" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Edad</label>
            <input type="number" class="form-control" id="edad" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">¿Es Creyente?</label>
            <select class="form-select" id="creyente" required>
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Dirección (San Andrés Tuxtla)</label>
          <input type="text" class="form-control" id="direccion" required placeholder="Calle, Colonia">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Teléfono / WhatsApp</label>
            <input type="tel" class="form-control" id="telefono" required placeholder="294...">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Fecha de Nacimiento</label>
            <input type="date" class="form-control" id="fechaNac" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Fotografía (Tomar foto o subir archivo)</label>
          <input type="file" class="form-control" id="fotoFile" accept="image/*" capture="user">
        </div>

        <button type="submit" class="btn btn-custom w-100 py-2">Guardar Registro</button>
      </form>
    </div>
  </div>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nombre = document.getElementById('nombre').value;
      const edad = document.getElementById('edad').value;
      const seccion = document.getElementById('seccion').value;
      const creyente = document.getElementById('creyente').value;
      const direccion = document.getElementById('direccion').value;
      const telefono = document.getElementById('telefono').value;
      const fechaNac = document.getElementById('fechaNac').value;
      const fileInput = document.getElementById('fotoFile').files[0];

      let fotoUrl = '';
      if(fileInput) {
        const fileName = `${Date.now()}_${fileInput.name}`;
        const { data, error } = await _supabase.storage.from('fotos-iglesia').upload(fileName, fileInput);
        if(!error) {
          const { data: publicURL } = _supabase.storage.from('fotos-iglesia').getPublicUrl(fileName);
          fotoUrl = publicURL.publicUrl;
        }
      }

      const { error } = await _supabase.from('registros_iglesia').insert([
        { nombre_completo: nombre, edad, seccion, creyente, direccion, telefono, fecha_nacimiento: fechaNac, foto_url: fotoUrl }
      ]);

      if(error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Registro guardado exitosamente!');
        document.getElementById('formRegistro').reset();
      }
    });
  </script>
</body>
</html>s
