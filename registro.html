<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Congregantes - Manantial de Vida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🕊️ Manantial de Vida</a>
    </div>
  </nav>

  <div class="container my-5 animate-fade" style="max-width: 650px;">
    <div class="card shadow-lg p-4 rounded-4 border-0">
      <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: var(--primary-navy);">📝 Formulario de Registro</h2>
        <p class="text-muted">Manantial de Vida - San Andrés Tuxtla</p>
      </div>

      <form id="formRegistro">
        <!-- Pregunta 1: Sección -->
        <div class="mb-3">
          <label class="form-label fw-bold">1. Sección de Pertenencia</label>
          <select class="form-select border-2" id="seccion" required>
            <option value="congregante">Congregantes / Adultos</option>
            <option value="adolescente">Adolescentes / Jóvenes</option>
          </select>
        </div>

        <!-- Pregunta 2: Nombre Completo -->
        <div class="mb-3">
          <label class="form-label fw-bold">2. Nombre Completo</label>
          <input type="text" class="form-control border-2" id="nombre" placeholder="Nombre(s) y Apellidos" required>
        </div>

        <!-- Pregunta 3 & 4: Edad y Creyente -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">3. Edad</label>
            <input type="number" class="form-control border-2" id="edad" placeholder="Años" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">4. ¿Es Creyente / Bautizado?</label>
            <select class="form-select border-2" id="creyente" required>
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <!-- Pregunta 5: Dirección para Maps -->
        <div class="mb-3">
          <label class="form-label fw-bold">5. Dirección (Calle, Número, Colonia)</label>
          <input type="text" class="form-control border-2" id="direccion" placeholder="Ej. Calle Juárez #123, Col. Centro" required>
        </div>

        <!-- Pregunta 6 & 7: Teléfono y Fecha Nacimiento -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">6. Teléfono / WhatsApp</label>
            <input type="tel" class="form-control border-2" id="telefono" placeholder="294 123 4567" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">7. Fecha de Nacimiento</label>
            <input type="date" class="form-control border-2" id="fechaNac" required>
          </div>
        </div>

        <!-- Pregunta 8: Tomar o Subir Foto -->
        <div class="mb-4">
          <label class="form-label fw-bold">8. Fotografía Personal (Tomar foto o Seleccionar)</label>
          <input type="file" class="form-control border-2" id="fotoFile" accept="image/*" capture="user" required>
          <div class="form-text">Puedes tomarte la foto directo con la cámara del celular o seleccionar una de tu galería.</div>
        </div>

        <button type="submit" id="btnEnviar" class="btn btn-custom w-100 py-3 rounded-3 fs-5">
          💾 Registrar Información
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.innerText = 'Guardando datos...';

      try {
        const nombre = document.getElementById('nombre').value;
        const edad = parseInt(document.getElementById('edad').value);
        const seccion = document.getElementById('seccion').value;
        const creyente = document.getElementById('creyente').value;
        const direccion = document.getElementById('direccion').value;
        const telefono = document.getElementById('telefono').value;
        const fechaNac = document.getElementById('fechaNac').value;
        const fileInput = document.getElementById('fotoFile').files[0];

        let fotoUrl = '';
        if(fileInput) {
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
          const { data: uploadData, error: uploadErr } = await _supabase.storage.from('fotos-iglesia').upload(fileName, fileInput);
          if(!uploadErr) {
            const { data: pubUrl } = _supabase.storage.from('fotos-iglesia').getPublicUrl(fileName);
            fotoUrl = pubUrl.publicUrl;
          }
        }

        const { error } = await _supabase.from('registros_iglesia').insert([{
          nombre_completo: nombre, edad, seccion, creyente, direccion, telefono, fecha_nacimiento: fechaNac, foto_url: fotoUrl
        }]);

        if(error) throw error;
        alert('¡Registro exitoso! Bendiciones.');
        document.getElementById('formRegistro').reset();
      } catch (err) {
        alert('Error al registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 Registrar Información';
      }
    });
  </script>
</body>
</html>
